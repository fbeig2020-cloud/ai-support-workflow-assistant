# Automated PR review via the official Claude Code GitHub Action.
# Setup required before this runs (see CLAUDE.md / PROGRESS.md notes for this change):
#   1. Install the Claude GitHub App (https://github.com/apps/claude) on this repository.
#   2. Add an ANTHROPIC_API_KEY repo secret (Settings -> Secrets and variables -> Actions).
# Docs: https://code.claude.com/docs/en/github-actions.md
name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
